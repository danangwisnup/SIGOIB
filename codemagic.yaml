workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sigoib.mobile

    scripts:
      - name: Install dependencies
        script: |
          yarn install --frozen-lockfile

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/Sigoib.xcworkspace \
            --scheme Sigoib

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
